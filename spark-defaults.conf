# spark-defaults.conf

# 1. Iceberg Spark Extensions
spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions


spark.sql.catalog.lakehouse            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type       rest
spark.sql.catalog.lakehouse.uri        http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse  s3://warehouse/
spark.sql.catalog.lakehouse.s3.path-style-access true

# 2. Set this Spark Shuffle Partition for prevent OOM in small cluster
spark.sql.shuffle.partitions           8
spark.default.parallelism              8

# Limit JVM Heap size to avoid OOM
spark.driver.memory                    2g
spark.executor.memory                  2g
spark.memory.fraction                  0.6
spark.driver.memoryOverhead            1g
spark.executor.memoryOverhead          1g

# --- Storage / IO Safety ---
# 少量多餐：降低讀檔的記憶體峰值 (16MB)
spark.sql.files.maxPartitionBytes      16777216

# 關閉 Adaptive Query Execution (Streaming 其實不支援，關掉避免 Log 吵鬧)
spark.sql.adaptive.enabled             false

# 3. 讓 Spark 支援 S3 FileIO (相容 REST Catalog)
spark.sql.catalog.lakehouse.io-impl    org.apache.iceberg.aws.s3.S3FileIO

# 4. Hadoop S3A 連線設定 (這是給 FileIO 用的底層設定)
spark.hadoop.fs.s3.impl                org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint           http://minio:9000
spark.hadoop.fs.s3a.access.key         admin
spark.hadoop.fs.s3a.secret.key         password
spark.hadoop.fs.s3a.path.style.access  true
spark.hadoop.fs.s3a.connection.ssl.enabled false

# 5. Logging
spark.eventLog.enabled                 true
spark.eventLog.dir                     /home/iceberg/spark-events
spark.history.fs.logDirectory          /home/iceberg/spark-events
spark.sql.catalogImplementation        in-memory


spark.jars.packages                    org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
