# spark-defaults-aws.conf — AWS deployment overrides for EMR Serverless
# Used instead of spark-defaults.conf when submitting jobs via EMR Serverless.
# Local dev continues to use spark-defaults.conf (REST catalog + MinIO).

# 1. Iceberg Spark Extensions (unchanged)
spark.sql.extensions                               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# 2. Iceberg catalog — Glue Data Catalog replaces local REST catalog
spark.sql.catalog.lakehouse                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl           org.apache.iceberg.aws.glue.GlueCatalog
spark.sql.catalog.lakehouse.warehouse              s3://warehouse/
spark.sql.catalog.lakehouse.io-impl                org.apache.iceberg.aws.s3.S3FileIO

# 3. S3 FileIO — IAM role-based auth; no endpoint override needed on AWS
spark.hadoop.fs.s3.impl                            org.apache.hadoop.fs.s3a.S3AFileSystem

# 4. Shuffle / memory (same as local)
spark.sql.shuffle.partitions                       8
spark.default.parallelism                          8
spark.driver.memory                                2g
spark.executor.memory                              2g
spark.memory.fraction                              0.6
spark.driver.memoryOverhead                        1g
spark.executor.memoryOverhead                      1g
spark.sql.files.maxPartitionBytes                  16777216
spark.sql.adaptive.enabled                         false

# 5. Packages — same runtime deps as local
spark.jars.packages                                org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
